services:
  incident-api:
    image: python:3.12-slim-bookworm
    command: ["python", "/srv/server.py"]
    volumes:
      - ./incident_api:/srv:ro
      - ./runtime-state:/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()
      interval: 1s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    cpus: 0.50

  demo:
    build:
      context: .
      args:
        RETRACE_VERSION: ${RETRACE_VERSION:-0.2.25}
    depends_on:
      incident-api:
        condition: service_healthy
    environment:
      ORDERS_API_URL: http://incident-api:8080/api/order-batches/current
      RETRACE_API_KEY: ${RETRACE_API_KEY:-}
      ALLOW_FREE_RETRACE_AI: ${ALLOW_FREE_RETRACE_AI:-1}
      RETRACE_AI_MAX_TOOL_CALLS: ${RETRACE_AI_MAX_TOOL_CALLS:-70}
      RETRACE_AI_TIME_BUDGET: ${RETRACE_AI_TIME_BUDGET:-240}
      RETRACE_AI_MAX_OUTPUT_TOKENS: ${RETRACE_AI_MAX_OUTPUT_TOKENS:-2600}
    volumes:
      - ./recordings:/app/recordings
      - ./reports:/app/reports
      - ./runtime-state:/state
    mem_limit: 1536m
    cpus: 2.0
