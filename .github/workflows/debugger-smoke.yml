name: Debugger recording smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      regenerate_recording:
        description: Regenerate and upload the bundled recording before verification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-debugger-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate bundled recording
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_recording }}
        run: |
          docker compose build demo
          docker compose up -d --wait incident-api
          rm -f recordings/runtime-incident.retrace
          set +e
          docker compose run --rm --no-deps demo \
            sh -lc 'unset RETRACE_AUTO_DEBUG; cd /app; retracepython --recording /app/recordings/runtime-incident.retrace -m pytest -vs tests'
          status=$?
          set -e
          test "${status}" -eq 1
          test -s recordings/runtime-incident.retrace
          cp recordings/runtime-incident.retrace debug-recording/runtime-state.retrace
      - name: Upload regenerated recording
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_recording }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-state-recording-${{ github.run_id }}
          path: debug-recording/runtime-state.retrace
          if-no-files-found: error
          retention-days: 1
      - name: Test report rendering and quality gates
        run: make test
      - name: Build debugger container
        run: docker compose -p retrace-runtime-state-debugger -f .devcontainer/docker-compose.yml build
      - name: Verify replay and DAP inspection
        run: docker compose -p retrace-runtime-state-debugger -f .devcontainer/docker-compose.yml run --rm demo python /app/scripts/verify_debugger.py --all
      - name: Clean up
        if: always()
        run: |
          docker compose down -v --remove-orphans
          docker compose -p retrace-runtime-state-debugger -f .devcontainer/docker-compose.yml down -v --remove-orphans
